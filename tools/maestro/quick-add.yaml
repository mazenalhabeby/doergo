# Quick add on the phone (LOCAL only): + , type a sentence, check what was read, save, find it tomorrow.
appId: com.hbcfield.app
---
- extendedWaitUntil:
    visible: "More"
    timeout: 60000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- tapOn: "More"
- tapOn: "Calendar"
- extendedWaitUntil:
    visible: "E2E phone review"
    timeout: 60000
- tapOn: "New"
- extendedWaitUntil:
    visible: "Add"
    timeout: 20000
- inputText: "Remind me to call Mueller tomorrow at 2"
- hideKeyboard
- takeScreenshot: m6-quick-add
- assertVisible: "Call Mueller"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Call Mueller"
    timeout: 20000
- tapOn: "WED"
- extendedWaitUntil:
    visible: "Call Mueller"
    timeout: 30000
- takeScreenshot: m7-tomorrow
- tapOn: "Next week"
- takeScreenshot: m8-next-week
- tapOn: "Today"
- takeScreenshot: m9-today
