<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#05080f;--ink:#e8eef8;--muted:#93a1b8;--dim:#5c6b82;--brand:#2563eb;--brand2:#60a5fa;--ok:#22c55e;--sug:#f59e0b;--red:#f87171;--card:#0e1524;--line:#24324a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--g);color:var(--ink);font-family:'IBM Plex Sans Arabic',Inter,system-ui,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.45}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.disp{font-weight:700;line-height:1.15}
.lat{font-family:Archivo,Inter,sans-serif;direction:ltr;unicode-bidi:isolate}
.card{position:absolute;border-radius:24px;background:var(--card);border:2px solid var(--line);box-shadow:0 40px 90px #000b;overflow:hidden}
.card .hd{padding:18px 26px;border-bottom:2px solid var(--line);font-weight:700;font-size:28px;color:var(--muted);display:flex;gap:12px;align-items:center}
.card .bd{padding:24px 26px;font-size:28px;line-height:1.55}
.chip{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 24px;font-weight:700;font-size:28px}
.ok{background:#22c55e22;color:#86efac;border:2px solid #22c55e66}
.sug{background:#f59e0b22;color:#fcd34d;border:2px solid #f59e0b77}
.no{background:#f8717122;color:#fca5a5;border:2px solid #f8717166}
.blue{background:#2563eb33;color:#bfdbfe;border:2px solid #60a5fa66}
.field{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #1f2b40;font-size:28px}
.field .k{color:var(--muted)}
.field .v{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;height:68px;padding:0 40px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:30px}
.arrow{font-size:90px;color:var(--brand2);font-weight:700}
#sub{position:absolute;left:180px;right:180px;bottom:44px;text-align:center;font-weight:600;font-size:40px;line-height:1.45;color:#fff;text-shadow:0 2px 10px #000,0 0 3px #000}
#chap{position:absolute;right:96px;top:64px;display:flex;align-items:baseline;gap:18px;opacity:0}
#chap .n{font-family:Archivo;font-weight:900;font-size:28px;color:var(--brand2)}
#chap .tt{font-weight:700;font-size:28px;color:var(--muted)}
</style></head>

<div class="blob" id="b1" style="width:900px;height:900px;background:#1d4ed8;right:-200px;top:-300px"></div>

<div id="sub"></div>
</div>
<script>
const TL = {"chapters":[{"id":"intro","start":0.4,"end":11.063,"phrases":[{"text":"الذكاء الاصطناعي في HBCField.","start":0.4,"end":2.861,"wordStarts":[0.4,1.027,1.747,1.898]},{"text":"أين نحن اليوم، وأين يفيدنا فعلاً، وأين يجب ألّا يقرّر أبداً.","start":3.886,"end":10.063,"wordStarts":[3.886,4.304,4.618,5.349,5.872,6.475,6.998,7.427,7.88,8.333,8.925]}]},{"id":"today","start":11.063,"end":39.651,"phrases":[{"text":"اليوم لا يوجد أي ذكاء اصطناعي داخل البرنامج.","start":11.063,"end":14.546,"wordStarts":[11.063,11.609,11.783,12.154,12.421,12.839,13.536,13.861]},{"text":"كل ما يبدو ذكياً هو قراءة للنص من الصورة، ثم قواعد كتبناها بأنفسنا.","start":15.313,"end":20.479,"wordStarts":[15.313,15.58,15.685,15.905,16.567,16.846,17.287,17.728,17.856,18.541,18.842,19.295,19.806]},{"text":"بطاقات العمل، إيصالات الوقود، العقود، وجوازات السفر.","start":21.246,"end":25.6,"wordStarts":[21.246,21.757,22.361,22.895,23.638,24.462,25.101]},{"text":"كلها تُقرأ على الهاتف أو على خادمنا، ولا يخرج منها شيء إلى أي جهة أخرى.","start":26.263,"end":31.325,"wordStarts":[26.263,26.658,27.006,27.18,27.609,27.76,27.946,28.735,28.979,29.374,29.664,29.978,30.164,30.431,30.802]},{"text":"وقارئ المستندات فيه مكان جاهز لقارئ ذكي، يضيف اقتراحاته بجانب القواعد.","start":32.266,"end":38.651,"wordStarts":[32.266,32.8,33.531,33.856,34.367,34.773,35.296,36.062,36.422,37.316,37.711]}]},{"id":"report","start":39.651,"end":59.241,"phrases":[{"text":"أول فكرة: تقرير الخدمة في نهاية المهمة.","start":39.651,"end":42.542,"wordStarts":[39.651,39.999,40.673,41.091,41.462,41.59,41.961]},{"text":"الفنّي يتكلّم بجملة قصيرة، أو يكتب كلمات مختصرة بأي لغة.","start":43.309,"end":47.535,"wordStarts":[43.309,43.82,44.342,44.725,45.306,45.503,45.886,46.316,46.85,47.117]},{"text":"والذكاء الاصطناعي يحوّلها إلى تقرير مرتّب، بلغة العميل، مع قائمة المهام المنجزة.","start":48.314,"end":54.386,"wordStarts":[48.314,48.848,49.649,50.287,50.473,50.856,51.599,51.982,52.667,52.923,53.352,53.77]},{"text":"والفنّي يراجعه ويؤكّده قبل الحفظ.","start":55.211,"end":58.241,"wordStarts":[55.211,55.722,56.43,57.138,57.347]}]},{"id":"job","start":59.241,"end":77.809,"phrases":[{"text":"الفكرة الثانية: مهمة جديدة من رسالة بريد أو مكالمة.","start":59.241,"end":63.664,"wordStarts":[59.241,59.798,60.727,61.308,61.83,62.016,62.503,62.887,63.061]},{"text":"تلصق نص الرسالة، فيقترح البرنامج مسودة مهمة.","start":64.431,"end":68.274,"wordStarts":[64.431,64.849,65.093,65.836,66.382,67.067,67.74]},{"text":"العميل، والعنوان، والأولوية، ونوع العمل المطلوب.","start":69.053,"end":73.151,"wordStarts":[69.053,69.866,70.748,71.793,72.211,72.582]},{"text":"وأنت تراجع ما فهمه، ثم تضغط إنشاء.","start":73.883,"end":76.809,"wordStarts":[73.883,74.255,74.673,74.801,75.312,75.602,76.008]}]},{"id":"documents","start":77.809,"end":97.292,"phrases":[{"text":"الفكرة الثالثة: المستندات والإيصالات.","start":77.809,"end":80.7,"wordStarts":[77.809,78.308,79.005,79.829]},{"text":"عندما لا تجد القواعد تاريخ انتهاء الشهادة، أو المبلغ في إيصال ممزّق،","start":81.467,"end":86.215,"wordStarts":[81.467,81.908,82.036,82.314,82.86,83.162,83.51,84.288,84.509,84.996,85.159,85.577]},{"text":"يقترح الذكاء الاصطناعي القيمة، مع علامة مقترح.","start":86.678,"end":90.393,"wordStarts":[86.678,87.189,87.595,88.28,89.012,89.348,89.801]},{"text":"أما ما تثبته القواعد، مثل رمز جواز السفر، فيبقى مُثبتاً كما هو.","start":91.149,"end":96.292,"wordStarts":[91.149,91.404,91.52,91.938,92.832,93.157,93.447,93.738,94.376,94.829,95.398,95.653]}]},{"id":"office","start":97.292,"end":116.55,"phrases":[{"text":"وفي المكتب أيضاً.","start":97.292,"end":98.523,"wordStarts":[97.292,97.559,98.035]},{"text":"تقرير تطلبه بجملة: ساعات العمل الإضافية لكل موقع في الربع الأخير.","start":99.074,"end":103.927,"wordStarts":[99.074,99.503,99.91,100.687,101.163,101.547,102.127,102.51,102.951,103.067,103.334]},{"text":"بحث بالمعنى: مهمة السخّان الذي يسرّب عند بيلا في الربيع.","start":104.81,"end":109.105,"wordStarts":[104.81,105.146,105.982,106.493,107.062,107.387,107.898,108.165,108.444,108.536]},{"text":"ترجمة رسائل الفريق، وتلخيص محادثة طويلة، وتصنيف طلبات الدعم.","start":109.838,"end":115.55,"wordStarts":[109.838,110.43,110.859,111.614,112.287,112.995,113.762,114.424,114.865]}]},{"id":"never","start":116.55,"end":140.459,"phrases":[{"text":"وهناك أماكن يجب ألّا يقرّر فيها الذكاء الاصطناعي أبداً.","start":116.55,"end":120.335,"wordStarts":[116.55,117.049,117.49,117.804,118.083,118.535,118.733,119.151,119.812]},{"text":"مبالغ الفواتير، وساعات الرواتب، ومن يرى ماذا، والتحقّق من الموقع عند تسجيل الحضور.","start":121.113,"end":127.453,"wordStarts":[121.113,121.543,122.367,122.971,123.749,124.051,124.295,124.782,125.49,125.641,126.106,126.373,126.86]},{"text":"هنا يبقى الحساب بالقواعد، لأنه مال وقانون، ويجب أن يُشرح ويُراجع.","start":128.278,"end":133.629,"wordStarts":[128.278,128.626,128.893,129.357,130.309,130.855,131.087,131.842,132.329,132.48,132.956]},{"text":"القاعدة بسيطة: الذكاء الاصطناعي يقترح، والإنسان يقرّر.","start":134.42,"end":139.458,"wordStarts":[134.42,135.035,135.824,136.417,137.078,137.775,138.471]}]},{"id":"decision","start":140.459,"end":164.089,"phrases":[{"text":"قبل أن نبدأ، هناك قرار واحد.","start":140.459,"end":142.758,"wordStarts":[140.459,140.738,140.854,141.457,141.899,142.27]},{"text":"خادم خاص بنا، فلا تخرج جوازات السفر والعقود من عندنا أبداً، لكنه يحتاج شراء أجهزة.","start":143.502,"end":149.934,"wordStarts":[143.502,144.012,144.291,144.848,145.115,145.452,145.916,146.311,146.81,146.95,147.31,148.029,148.564,149.005,149.341]},{"text":"أو خدمة سحابية في أوروبا لا تحتفظ بالبيانات، أسرع في البداية، وندفع حسب الاستخدام.","start":150.677,"end":156.97,"wordStarts":[150.677,151.014,151.339,151.792,151.873,152.57,152.779,153.278,153.905,154.381,154.462,155.298,155.902,156.215]},{"text":"وفي الحالتين: يُفعَّل لكل شركة على حدة، ويُسجَّل كل ما أُرسل.","start":157.702,"end":163.089,"wordStarts":[157.702,157.934,158.84,159.374,159.78,160.151,160.372,160.987,161.765,162.125,162.241]}]},{"id":"start","start":164.089,"end":185,"phrases":[{"text":"اقتراحنا: نبدأ بتقرير الخدمة، والمهمة من الرسالة.","start":164.089,"end":168.559,"wordStarts":[164.089,165.343,165.842,166.423,166.991,167.607,167.804]},{"text":"بيانات شخصية قليلة، وفائدة يراها الفريق كل يوم.","start":169.442,"end":173.471,"wordStarts":[169.442,169.953,170.498,171.253,171.88,172.228,172.67,173.018]},{"text":"ثم المستندات والإيصالات، بعد قرار الخادم أو السحابة.","start":174.296,"end":178.557,"wordStarts":[174.296,174.586,175.329,176.211,176.606,176.966,177.523,177.755]},{"text":"HBCField: الذكاء يساعد، وأنت تقرّر.","start":179.76,"end":183.801,"wordStarts":[179.76,181.258,181.873,182.523,182.93]}]}],"duration":187.5,"lang":"ar"};
const CH = Object.fromEntries(TL.chapters.map(c => [c.id, c]));
const P = (c, i) => CH[c].phrases[Math.min(i, CH[c].phrases.length - 1)].start;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const fade = (t, a, d = .45) => clamp((t - a) / d);
const spring = x => x <= 0 ? 0 : x >= 1.6 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(11 * x);
const sp = (t, a, d = 1) => spring((t - a) / d);
function el(tag, cls, html, st) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (st) Object.assign(e.style, st); return e; }
/** Show from phrase start: fade + rise (spring). */
function enter(n, t, a, { dy = 40, dur = .9, out = Infinity } = {}) {
  n.style.opacity = fade(t, a) * (1 - fade(t, out, .35));
  n.style.transform = `translateY(${dy * (1 - sp(t, a, dur))}px)`;
}
const SCENES = [];
const scene = (c, i, build) => SCENES.push({ c, i, build });
const TITLES = { intro: '', today: 'اليوم', report: 'تقرير الخدمة', job: 'مهمة من رسالة', documents: 'المستندات والإيصالات', office: 'في المكتب', never: 'أين لا يقرّر', decision: 'القرار', start: 'من أين نبدأ' };

// 1 · intro
scene('intro', 0, root => {
  const h = el('div', 'abs disp', 'الذكاء الاصطناعي في <span class="lat" style="color:var(--brand2)">HBCField</span>', { left: 0, right: 0, top: '300px', textAlign: 'center', fontSize: '110px' });
  const chips = ['أين نحن اليوم', 'أين يفيدنا فعلاً', 'أين لا يقرّر أبداً'].map((x, i) =>
    el('div', 'abs chip ' + ['blue', 'ok', 'no'][i], x, { top: '540px', right: (420 + i * 380) + 'px' }));
  root.append(h, ...chips);
  return t => { enter(h, t, P('intro', 0) - .3, { dy: 60 }); chips.forEach((c, i) => enter(c, t, P('intro', 1) + i * .7)); };
});

// 2 · today
scene('today', 0, root => {

  const arr = [0, 1, 2].map(i => el('div', 'abs arrow', '←', { right: (480 + i * 410) + 'px', top: '360px' }));
  const kinds = ['بطاقة عمل', 'إيصال وقود', 'عقد', 'جواز سفر'].map((x, i) => el('div', 'abs chip blue', x, { right: (140 + i * 300) + 'px', top: '560px' }));
  const lock = el('div', 'abs chip ok', 'على الهاتف أو على خادمنا · لا يخرج شيء', { right: '140px', top: '660px' });
  const slot = el('div', 'abs', '<div style="border:3px dashed #60a5fa;border-radius:24px;padding:26px 34px;font-size:30px;font-weight:700;color:#bfdbfe">مكان جاهز لقارئ ذكي · يقترح بجانب القواعد</div>', { right: '960px', top: '650px' });
  root.append(zero, ...steps, ...arr, ...kinds, lock, slot);
  return t => {
    enter(zero, t, P('today', 0) - .2);
    steps.forEach((s, i) => enter(s, t, P('today', 1) + i * .45)); arr.forEach((a, i) => enter(a, t, P('today', 1) + i * .45 + .25, { dy: 0 }));

scene('report', 0, root => {
  const phone = el('div', 'abs card', `<div class="hd">ملاحظة الفنّي الصوتية</div><div class="bd lat" style="font-family:Inter;font-size:27px;color:#cbd5e1">boiler cleaned, filter changed,<br>pressure ok 1.5 bar,<br>customer not home</div>`, { right: '150px', top: '230px', width: '560px' });

  const rec = el('div', 'abs card', `<div class="hd">إيصال وقود ممزّق</div><div class="bd"><div class="field"><span class="k">المبلغ</span><span class="v lat" id="amt" style="font-family:Inter">€ 6?,40</span></div></div>`, { right: '980px', top: '210px', width: '640px' });
  const pass = el('div', 'abs card', `<div class="hd">جواز سفر · رمز القراءة الآلية</div><div class="bd lat" style="font-family:monospace;font-size:24px;direction:ltr;text-align:left;color:#cbd5e1">P&lt;AUTMUSTERMANN&lt;&lt;ANNA&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;<br>U1234567&lt;8AUT9001011F3103285&lt;&lt;&lt;</div>`, { right: '140px', top: '560px', width: '900px' });

});

  const b = mk('بحث بالمعنى', '«مهمة السخّان الذي يسرّب عند بيلا في الربيع»<div class="field" style="margin-top:8px"><span class="v lat" style="font-family:Inter">Boiler leak · BILLA Wien 10</span><span class="k">أبريل</span></div>', 1000, 160);

  const d = mk('طلبات الدعم', '«لا أستطيع تسجيل الحضور في الموقع» <div style="margin-top:12px"><span class="chip blue">الحضور</span> <span class="chip sug">عاجل</span></div>', 1000, 560);
  root.append(a, b, c, d);
  return t => { enter(a, t, P('office', 1)); enter(b, t, P('office', 2)); enter(c, t, P('office', 3)); enter(d, t, P('office', 3) + 1.2); };
});

    el('div', 'abs card', `<div class="bd" style="text-align:center;font-size:34px;font-weight:700;padding:40px 20px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#93a1b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><br>${x}</div>`, { right: (140 + i * 420) + 'px', top: '200px', width: '380px' }));

// 9 · start
scene('start', 0, root => {
  const steps = [['الآن', 'تقرير الخدمة · المهمة من الرسالة', 'ok'], ['بعد القرار', 'المستندات · الإيصالات', 'sug'], ['لاحقاً', 'التقارير · البحث · الترجمة · الدعم', 'blue']].map(([w, x, c], i) =>
    el('div', 'abs card', `<div class="bd"><span class="chip ${c}">${w}</span><div style="font-size:34px;font-weight:700;margin-top:18px">${x}</div></div>`, { right: (140 + i * 560) + 'px', top: '200px', width: '520px' }));
  const end = el('div', 'abs', '<div class="disp" style="font-size:96px"><span class="lat" style="color:var(--brand2)">HBCField</span></div><div class="disp" style="font-size:64px;margin-top:20px">الذكاء يساعد، وأنت تقرّر</div>', { left: 0, right: 0, top: '540px', textAlign: 'center' });
  root.append(...steps, end);
  return t => {
    steps[0].style.opacity = fade(t, P('start', 0)); steps[1].style.opacity = fade(t, P('start', 2)); steps[2].style.opacity = fade(t, P('start', 2) + .8);
    steps.forEach(s => s.style.transform = `translateY(${30 * (1 - clamp(+s.style.opacity))}px)`);
    enter(end, t, P('start', 3), { dy: 50 });

/* ── assemble ── */
const root = document.getElementById('scenes');
SCENES.forEach(s => { s.root = el('div', 'scene'); root.appendChild(s.root); s.upd = s.build(s.root); s.start = Math.max(0, P(s.c, s.i) - .5); });
SCENES.forEach((s, i) => { s.end = i + 1 < SCENES.length ? SCENES[i + 1].start : TL.duration; });
const chap = document.getElementById('chap'), sub = document.getElementById('sub');
const allPhr = TL.chapters.flatMap(c => c.phrases.map(p => ({ ...p, c: c.id })));
function render(t) {
  const b = Math.sin(t / 9), c = Math.cos(t / 11);
  document.getElementById('b1').style.transform = `translate(${80 * b}px,${60 * c}px)`;
  document.getElementById('b2').style.transform = `translate(${-70 * c}px,${-50 * b}px)`;
  document.getElementById('b3').style.transform = `translate(${120 * c}px,${-80 * b}px)`;
  for (const s of SCENES) {
    const vis = t >= s.start - .01 && t < s.end + .4;
    if (!vis) { s.root.style.opacity = 0; continue; }
    s.root.style.opacity = Math.min(fade(t, s.start, .45), 1 - fade(t, s.end, .4)); s.upd(t);
  }
  const ch = TL.chapters.findIndex(c => t >= c.start - .3 && t < c.end + .2);
  if (ch > 0) {
    const cc = TL.chapters[ch];
    chap.querySelector('.n').textContent = String(ch).padStart(2, '0');
    chap.querySelector('.tt').textContent = TITLES[cc.id];
    chap.style.opacity = Math.min(fade(t, cc.start - .3, .5), 1 - fade(t, cc.end - .3, .4));
  } else chap.style.opacity = 0;
  let cur = null;
  for (const p of allPhr) if (t >= p.start - .15 && t <= p.end + .6) cur = p;
  if (cur) {
    if (sub._t !== cur.text) { sub.textContent = cur.text; sub._t = cur.text; }
    sub.style.opacity = Math.min(fade(t, cur.start - .15, .2), 1 - fade(t, cur.end + .4, .2));
  } else sub.style.opacity = 0;
}
window.__ready = document.fonts.ready;
</script></body></html>
