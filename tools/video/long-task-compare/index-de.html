<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#05080f;--ink:#e8eef8;--muted:#93a1b8;--dim:#5c6b82;--brand:#2563eb;--brand2:#60a5fa;
  --travel:#38bdf8;--work:#22c55e;--warn:#f59e0b;--red:#f87171;--off:#1b2433;--card:#0e1524;--line:#24324a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--g);color:var(--ink);font-family:Inter,system-ui,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.5}
#grain{position:absolute;inset:-50%;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.disp{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:-.02em;line-height:1.02}
.lbl{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:22px}
.card{position:absolute;border-radius:24px;background:var(--card);border:2px solid var(--line);box-shadow:0 30px 80px #000a}
.phone{position:absolute;width:430px;height:880px;border-radius:60px;background:#070b13;border:11px solid #1f2937;box-shadow:0 40px 100px #000d;overflow:hidden}
.phone .notch{position:absolute;left:50%;top:14px;width:120px;height:32px;border-radius:20px;background:#000;transform:translateX(-50%)}
.phone .scr{position:absolute;inset:0;padding:70px 26px 30px;opacity:0}
.ph-t{font-family:Archivo;font-weight:900;font-size:34px}
.ph-s{font-size:17px;color:var(--muted);margin-top:4px}
.ph-box{margin-top:20px;border-radius:20px;background:#ffffff0a;border:1.5px solid #ffffff14;padding:18px}
.ph-btn{position:absolute;left:26px;right:26px;bottom:34px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-family:Archivo;font-weight:800;font-size:24px;color:#06101c}
.row{display:flex;justify-content:space-between;align-items:center;font-size:19px;padding:9px 0;border-bottom:1px solid #ffffff10}
.row:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 22px;font-family:Archivo;font-weight:800;font-size:24px}
.step{display:flex;align-items:center;gap:22px;font-family:Archivo;font-weight:800;font-size:34px;color:var(--dim);margin-bottom:30px}
.step i{width:52px;height:52px;border-radius:16px;border:2px solid #ffffff22;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px}
#sub{position:absolute;left:180px;right:180px;bottom:44px;text-align:center;font-family:Inter;font-weight:600;font-size:36px;line-height:1.3;color:#fff;text-shadow:0 2px 10px #000,0 0 3px #000}
#chap{position:absolute;left:96px;top:66px;display:flex;align-items:baseline;gap:18px;opacity:0}
#chap .n{font-family:Archivo;font-weight:900;font-size:26px;color:var(--brand2);letter-spacing:.08em}
#chap .tt{font-family:Archivo;font-weight:800;font-size:26px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tag{position:absolute;font-family:Archivo;font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;border-radius:999px}
.mono{font-family:Archivo;font-weight:900;font-variant-numeric:tabular-nums}
.bar{height:56px;border-radius:14px;background:var(--off);position:relative;overflow:hidden}
.bar span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-family:Archivo;font-weight:800;font-size:20px;color:#04121a;overflow:hidden;white-space:nowrap}
.av{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Archivo;font-weight:900;font-size:30px;color:#06101c}
</style></head>
<body><div id="stage">
<div class="blob" id="b1" style="width:900px;height:900px;background:#1d4ed8;left:-200px;top:-300px"></div>
<div class="blob" id="b2" style="width:800px;height:800px;background:#0f766e;right:-220px;bottom:-320px"></div>
<div class="blob" id="b3" style="width:600px;height:600px;background:#4338ca;left:700px;top:500px;opacity:.28"></div>
<div id="scenes"></div>
<div id="chap"><span class="n"></span><span class="tt"></span></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(transparent,#05080fe6 55%)"></div>
<div id="sub"></div>
<div id="grain"></div>
</div>
<script>
const TL = {"chapters":[{"id":"intro","start":0.4,"end":12.57,"phrases":[{"text":"Ein Einsatz über fünf Tage, sechs Stunden von zu Hause.","start":0.4,"end":3.604,"wordStarts":[0.4,0.655,1.166,1.41,1.712,2.06,2.339,2.78,2.977,3.128]},{"text":"Zwei Wege, ihn abzuwickeln.","start":4.587,"end":6.422,"wordStarts":[4.587,5.052,5.377,5.54]},{"text":"Der Ablauf aus diesem Video, und wie HBCField heute arbeitet.","start":7.147,"end":11.57,"wordStarts":[7.147,7.402,7.89,8.064,8.343,8.83,8.981,9.19,10.154,10.467]}]},{"id":"theirs","start":12.57,"end":39.476,"phrases":[{"text":"Dort tippt der Techniker auf Start, und ein Timer zählt die Fahrt.","start":12.57,"end":17.202,"wordStarts":[12.57,12.976,13.255,13.452,14.079,14.277,15.171,15.438,15.681,16.157,16.448,16.61]},{"text":"Vor Ort stempelt er sich jeden Tag direkt auf dem Auftrag ein und aus.","start":17.881,"end":22.641,"wordStarts":[17.881,18.171,18.508,18.996,19.088,19.367,19.739,20.099,20.598,20.749,20.946,21.561,21.91,22.13]},{"text":"Nach jedem Ausstempeln ist ein Tagesbericht Pflicht, bevor er wieder einstempeln kann.","start":23.482,"end":28.939,"wordStarts":[23.482,23.819,24.19,24.934,25.143,25.282,26.118,26.942,27.372,27.511,27.802,28.487]},{"text":"Am Freitag schließt er ab, trägt die Heimfahrt aus dem Gedächtnis ein, und der Kunde unterschreibt am Ende die ganze Woche.","start":29.722,"end":38.476,"wordStarts":[29.722,29.989,30.616,31.046,31.243,31.894,32.253,32.393,32.927,33.066,33.24,33.937,34.692,34.877,35.063,35.516,36.305,36.526,36.886,37.118,37.652]}]},{"id":"breaks","start":39.476,"end":72.409,"phrases":[{"text":"Das klingt gut. Aber in einer echten Woche bricht es an vier Stellen.","start":39.476,"end":44.097,"wordStarts":[39.476,39.882,40.242,41.067,41.392,41.519,41.833,42.309,42.611,42.913,43.04,43.214,43.493]},{"text":"Erstens. Die Uhr hängt am Auftrag, also brauchen zwei Aufträge an einem Tag eine Sonderregel.","start":45.038,"end":51.354,"wordStarts":[45.038,46.211,46.454,46.71,46.977,47.151,47.766,48.068,48.463,48.788,49.368,49.543,49.868,50.204,50.46]},{"text":"Zweitens. Die Heimfahrt wird von Hand eingetippt, sie ist also geschätzt.","start":52.357,"end":57.349,"wordStarts":[52.357,53.6,53.797,54.331,54.505,54.679,54.969,55.921,56.095,56.293,56.548]},{"text":"Drittens. Ein fehlender Bericht blockiert das nächste Einstempeln, und die Arbeit steht.","start":58.074,"end":64.019,"wordStarts":[58.074,59.119,59.456,59.944,60.304,60.722,60.942,61.383,62.173,62.359,62.649,63.276]},{"text":"Viertens. Ein einzelner Techniker. Ein Team von drei Leuten hat keinen Platz.","start":65.115,"end":71.408,"wordStarts":[65.115,66.3,66.636,67.24,68.378,68.656,68.958,69.144,69.423,69.806,70.003,70.386]}]},{"id":"ours","start":72.409,"end":107.431,"phrases":[{"text":"HBCField geht vom Menschen aus, nicht vom Auftrag.","start":72.409,"end":76.02,"wordStarts":[72.409,73.291,73.524,73.733,74.185,74.719,75.068,75.3]},{"text":"Sie stempeln einmal ein, für Ihren Tag. Jeder Auftrag, den Sie bearbeiten, zählt innerhalb dieser Schicht.","start":76.845,"end":83.532,"wordStarts":[76.845,77.019,77.495,77.855,78.331,78.644,78.981,79.863,80.305,80.885,81.059,81.199,81.895,82.255,82.708,83.033]},{"text":"Unterwegs zeichnet die echte Route auf der Karte auf, Kilometer für Kilometer, nicht nur einen Timer.","start":84.443,"end":92.07,"wordStarts":[84.443,85.209,85.65,85.824,86.23,86.59,86.765,86.927,87.333,87.972,88.761,88.924,90.039,90.456,90.735,91.304]},{"text":"Beim Ausstempeln pausiert der Auftrag von selbst, mit einer Übergabenotiz für den Nächsten.","start":93.074,"end":99.03,"wordStarts":[93.074,93.364,94.049,94.479,94.641,95.106,95.326,96.151,96.36,96.731,97.915,98.089,98.264]},{"text":"Und ein Team teilt sich einen Auftrag, jeder mit seiner eigenen Zeit, und mit einem Leiter.","start":99.941,"end":106.431,"wordStarts":[99.941,100.277,100.51,100.846,101.148,101.346,101.613,102.611,103.006,103.168,103.47,103.9,104.677,105.003,105.177,105.479]}]},{"id":"score","start":107.431,"end":132.579,"phrases":[{"text":"Im direkten Vergleich.","start":107.431,"end":108.813,"wordStarts":[107.431,107.675,108.128]},{"text":"Fahrt: ein Timer, gegen eine echte GPS-Route.","start":109.7,"end":113.729,"wordStarts":[109.7,110.432,110.722,111.662,111.976,112.243,112.649]},{"text":"Die Uhr: an einen Auftrag gebunden, gegen eine Schicht für beliebig viele Aufträge.","start":114.226,"end":120.124,"wordStarts":[114.226,114.482,115.271,115.55,115.84,116.304,117.233,117.57,117.825,118.313,118.51,119.056,119.369]},{"text":"Teams: eine Person, gegen ein Team mit Leiter.","start":120.738,"end":124.662,"wordStarts":[120.738,121.701,121.991,122.769,123.164,123.408,123.838,124.058]},{"text":"Dasselbe Ziel. HBCField misst einfach mehr, und verlangt vom Mitarbeiter weniger.","start":125.369,"end":131.58,"wordStarts":[125.369,126.019,126.773,127.841,128.109,128.503,128.979,129.177,129.664,129.838,130.512]}]},{"id":"plan","start":132.579,"end":181.469,"phrases":[{"text":"Der Ablauf hat aber gute Ideen. Also übernehmen wir sie, und machen sie klüger.","start":132.579,"end":138.082,"wordStarts":[132.579,132.892,133.392,133.612,133.868,134.193,135.18,135.69,136.259,136.445,136.689,136.944,137.269,137.444]},{"text":"Erstens zeigt der Auftrag seine Tage. Tag eins bis Tag fünf, mit Stunden und einer Notiz zu jedem.","start":139.128,"end":147.441,"wordStarts":[139.128,140.126,140.475,140.625,141.252,141.566,142.402,142.855,143.412,143.702,144.12,144.863,145.107,145.699,145.873,146.117,146.686,146.883]},{"text":"Zweitens wandert der Tagesbericht in das Ausstempeln: Erledigtes, Mängel, Teile, Fotos. Erbeten, nie blockierend.","start":148.305,"end":157.43,"wordStarts":[148.305,149.327,149.779,149.965,150.789,150.882,151.138,152.276,153.309,153.762,154.284,155.317,156.177,156.502]},{"text":"Drittens: Heimfahrt. Ein Tippen, und die Rückfahrt wird per GPS gemessen, wie die Hinfahrt.","start":158.016,"end":164.204,"wordStarts":[158.016,158.817,159.943,160.234,160.861,161.081,161.209,161.696,161.882,162.068,162.718,163.206,163.403,163.531]},{"text":"Viertens: eine Übersicht. Hinfahrt, Arbeit, Rückfahrt, und die Summe.","start":164.906,"end":170.792,"wordStarts":[164.906,165.788,166.195,167.147,168.099,168.958,169.829,170.107,170.293]},{"text":"Und zuletzt: Der Kunde unterschreibt jeden Tag oder am Ende, und der unterschriebene Bericht geht automatisch per E-Mail hinaus.","start":171.517,"end":180.469,"wordStarts":[171.517,171.819,172.62,172.852,173.247,173.99,174.455,174.884,175.198,175.407,175.859,175.999,176.173,176.951,177.427,177.763,178.704,178.936,179.331]}]},{"id":"outro","start":181.469,"end":188.949,"phrases":[{"text":"Ein langer Einsatz, so gemessen, wie er wirklich war.","start":181.469,"end":184.975,"wordStarts":[181.469,181.817,182.166,182.943,183.292,183.814,183.988,184.128,184.592]},{"text":"HBCField.","start":185.8,"end":187.449,"wordStarts":[185.8]}]}],"duration":191.45,"lang":"de"};
const DE = TL.lang === 'de';
const L = (en, de) => DE ? de : en;
const CH = Object.fromEntries(TL.chapters.map(c => [c.id, c]));
const P = (c, i) => CH[c].phrases[Math.min(i, CH[c].phrases.length - 1)].start;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const spring = x => x <= 0 ? 0 : x >= 1.6 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(11 * x);
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const fade = (t, at, d = .4) => clamp((t - at) / d);
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const scenesEl = document.getElementById('scenes');
const SCENES = [];
function scene(chId, html, upd) {
  const root = $(`<div class="scene">${html}</div>`); scenesEl.appendChild(root);
  const q = s => root.querySelector(s), qa = s => [...root.querySelectorAll(s)];
  SCENES.push({ root, start: CH[chId].start, end: CH[chId].end, upd: t => upd(t, q, qa) });
}
// pop-in: spring scale + fade, from t0
function pop(el, t, t0, from = .6, dy = 30) {
  const k = spring(t - t0), o = fade(t, t0, .25);
  el.style.opacity = o; el.style.transform = `translateY(${(1 - ease((t - t0) / .5)) * dy}px) scale(${from + (1 - from) * k})`;
}
const hm = s => { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = Math.floor(s) % 60; return [h, m, x].map(v => String(v).padStart(2, '0')).join(':'); };

const TITLES = {
  intro: L('A five-day job', 'Ein Einsatz über fünf Tage'),
  theirs: L('Their flow', 'Ihr Ablauf'),
  breaks: L('Where it breaks', 'Wo es bricht'),
  ours: L('How HBCField works', 'So arbeitet HBCField'),
  score: L('Side by side', 'Im Vergleich'),
  plan: L('The long job, smarter', 'Der lange Einsatz, klüger'),
  outro: 'HBCField',
};

/* ── 1 · intro: home → customer, five days ─────────────────────────────── */
scene('intro', `
  <div class="abs disp" id="h" style="left:150px;top:210px;font-size:110px;width:1000px">${L('5 days.<br>6 hours from home.', '5 Tage.<br>6 Stunden von zu Hause.')}</div>
  <svg class="abs" style="left:1080px;top:200px" width="720" height="420" viewBox="0 0 720 420">
    <path id="road" d="M60 340 C 220 340, 260 120, 420 160 S 620 80, 660 70" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>
    <circle cx="60" cy="340" r="22" fill="#60a5fa"/><circle cx="660" cy="70" r="22" fill="#22c55e"/>
  </svg>
  <div class="abs lbl" id="home" style="left:1100px;top:600px;color:#60a5fa">${L('Home base · Frisco, TX', 'Standort · Frisco, TX')}</div>
  <div class="abs lbl" id="cust" style="left:1560px;top:150px;color:#4ade80">${L('Customer', 'Kunde')}</div>
  <div class="abs" id="days" style="left:150px;top:560px;display:flex;gap:18px">
    ${[1,2,3,4,5].map(d => `<div class="pill" style="background:#ffffff10;border:2px solid #ffffff1c">${L('Day','Tag')} ${d}</div>`).join('')}
  </div>
  <div class="abs" id="vs" style="left:0;right:0;top:700px;display:flex;justify-content:center;gap:60px;align-items:center">
    <div class="pill" id="v1" style="background:#ffffff12;color:#cbd5e1;font-size:34px;padding:16px 34px">${L('Their flow', 'Ihr Ablauf')}</div>
    <div class="disp" id="v2" style="font-size:44px;color:var(--muted)">vs</div>
    <div class="pill" id="v3" style="background:var(--brand);color:#fff;font-size:34px;padding:16px 34px">HBCField</div>
  </div>`,
  (t, q, qa) => {
    pop(q('#h'), t, CH.intro.start + .1, .85);
    q('#road').style.strokeDashoffset = 900 * (1 - ease((t - CH.intro.start - .4) / 2.2));
    q('#home').style.opacity = fade(t, CH.intro.start + .5); q('#cust').style.opacity = fade(t, CH.intro.start + 2.3);
    qa('#days .pill').forEach((el, i) => pop(el, t, CH.intro.start + 1.2 + i * .18));
    ['#v1', '#v2', '#v3'].forEach((s, i) => pop(q(s), t, P('intro', 2) + i * .35, .5));
  });

/* ── 2 · their flow: a phone walks the week, steps on the right ─────────── */
const theirSteps = [L('Start · a timer counts the drive', 'Start · ein Timer zählt die Fahrt'), L('Clock in / out on the task', 'Ein-/Ausstempeln am Auftrag'), L('Daily report required', 'Tagesbericht ist Pflicht'), L('Type the drive home · sign at the end', 'Heimfahrt eintippen · am Ende unterschreiben')];
scene('theirs', `
  <div class="tag" style="left:1100px;top:120px;background:#ffffff12;color:#cbd5e1">${L('Their flow', 'Ihr Ablauf')}</div>
  <div class="phone" style="left:200px;top:130px;height:820px;filter:saturate(.55)">
    <div class="notch"></div>
    <div class="scr" id="s0"><div class="ph-t">${L('En route', 'Unterwegs')}</div><div class="ph-s">Frisco → McPherson</div>
      <div class="ph-box"><div class="ph-s">${L('Travel time', 'Fahrzeit')}</div><div class="mono" id="tm" style="font-size:66px;margin-top:6px">00:00:00</div></div>
      <div class="ph-btn" style="background:#60a5fa">${L('Arrived', 'Angekommen')}</div></div>
    <div class="scr" id="s1"><div class="ph-t">${L('Day 1 of 5', 'Tag 1 von 5')}</div><div class="ph-s">${L('Extrusion line overhaul', 'Extrusionslinie Überholung')}</div>
      <div class="ph-box">${[1,2,3,4,5].map(d => `<div class="row"><span>${L('Day','Tag')} ${d}</span><span style="color:var(--dim)">${L('planned','geplant')}</span></div>`).join('')}</div>
      <div class="ph-btn" style="background:#4ade80">${L('Clock in', 'Einstempeln')}</div></div>
    <div class="scr" id="s2"><div class="ph-t">${L('Daily report', 'Tagesbericht')}</div><div class="ph-s">${L('Required', 'Pflicht')}</div>
      <div class="ph-box"><div class="ph-s">${L('Work done','Erledigt')}</div><div style="font-size:19px;margin-top:6px">${L('Gearbox opened, bearing worn','Getriebe geöffnet, Lager verschlissen')}</div></div>
      <div class="ph-box" style="text-align:center"><div style="font-size:54px">🔒</div><div class="ph-s" style="margin-top:6px">${L('Clock in is blocked until it is saved','Einstempeln gesperrt, bis er gespeichert ist')}</div></div>
      <div class="ph-btn" style="background:#60a5fa">${L('Save daily report','Bericht speichern')}</div></div>
    <div class="scr" id="s3"><div class="ph-t">${L('Return trip', 'Heimfahrt')}</div><div class="ph-s">${L('Manual entry', 'Manuelle Eingabe')}</div>
      <div class="ph-box" style="display:flex;align-items:center;justify-content:space-between"><span class="pill" style="background:#ffffff14">−</span><span class="mono" style="font-size:52px">6 h 00</span><span class="pill" style="background:#ffffff14">+</span></div>
      <div class="ph-box"><div class="ph-s">${L('Customer signs the whole week','Kunde unterschreibt die ganze Woche')}</div>
        <svg width="340" height="90" viewBox="0 0 340 90"><path id="sig" d="M10 60 C 40 10, 60 90, 90 40 S 140 20, 160 55 S 220 70, 330 35" fill="none" stroke="#e8eef8" stroke-width="4" stroke-dasharray="500" stroke-dashoffset="500"/></svg></div>
      <div class="ph-btn" style="background:#4ade80">${L('Sign off','Abschließen')}</div></div>
  </div>
  <div class="abs" id="steps" style="left:820px;top:290px;width:960px">
    ${theirSteps.map((s, i) => `<div class="step"><i>${i + 1}</i><span>${s}</span></div>`).join('')}
  </div>`,
  (t, q, qa) => {
    const at = [P('theirs', 0), P('theirs', 1), P('theirs', 2), P('theirs', 3)];
    const cur = at.filter(a => t >= a - .2).length - 1;
    qa('.scr').forEach((el, i) => { el.style.opacity = i === cur ? fade(t, at[i] - .2, .35) : 0; el.style.transform = `translateX(${(1 - ease((t - at[i] + .2) / .5)) * 40}px)`; });
    q('#tm').textContent = hm(clamp((t - at[0]) / 4.5) * 22000);
    q('#sig').style.strokeDashoffset = 500 * (1 - ease((t - at[3] - 2.5) / 1.6));
    qa('#steps .step').forEach((el, i) => {
      pop(el, t, at[i] - .1, .9, 16);
      const on = i === cur;
      el.style.color = on ? '#e8eef8' : (i < cur ? '#93a1b8' : '#5c6b82');
      el.querySelector('i').style.background = on ? '#64748b' : 'transparent';
    });
  });

/* ── 3 · where it breaks: four red cards ─────────────────────────────────── */
const breaks = [

const allPhr = TL.chapters.flatMap(c => c.phrases);
const sub = document.getElementById('sub'), chap = document.getElementById('chap');
function render(t) {
  const b = Math.sin(t / 7), c = Math.cos(t / 9);
  document.getElementById('b1').style.transform = `translate(${80 * b}px,${60 * c}px)`;
  document.getElementById('b2').style.transform = `translate(${-70 * c}px,${-50 * b}px)`;
  document.getElementById('b3').style.transform = `translate(${120 * c}px,${-80 * b}px)`;
  document.getElementById('grain').style.transform = `translate(${(Math.floor(t * 24) * 37) % 200 - 100}px,${(Math.floor(t * 24) * 53) % 200 - 100}px)`;
  for (const s of SCENES) {
    const vis = t >= s.start - .01 && t < s.end + .4;
    if (!vis) { s.root.style.opacity = 0; continue; }
    s.root.style.opacity = Math.min(fade(t, s.start, .45), 1 - fade(t, s.end, .4)); s.upd(t);
  }
  const ci = TL.chapters.findIndex(c => t >= c.start - .3 && t < c.end + .2);
  if (ci > 0 && ci < TL.chapters.length - 1) {
    const c = TL.chapters[ci];
    chap.querySelector('.n').textContent = String(ci).padStart(2, '0');
    chap.querySelector('.tt').textContent = TITLES[c.id];
    chap.style.opacity = Math.min(fade(t, c.start - .3, .5), 1 - fade(t, c.end - .3, .4));
  } else chap.style.opacity = 0;
  let cur = null;
  for (const p of allPhr) if (t >= p.start - .15 && t <= p.end + .6) cur = p;
  if (cur) { if (sub._t !== cur.text) { sub.textContent = cur.text; sub._t = cur.text; } sub.style.opacity = Math.min(fade(t, cur.start - .15, .2), 1 - fade(t, cur.end + .4, .2)); }
  else sub.style.opacity = 0;
}
window.render = render;
window.__ready = document.fonts.ready;
