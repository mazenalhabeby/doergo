<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dynamic Task Types — flow screens</title>
<style>
  :root{
    --brand:#2563EB;--brand-50:#EFF4FF;--brand-100:#DBEAFE;--brand-700:#1D4ED8;--ink:#1e293b;--muted:#64748b;
    --faint:#94a3b8;--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--green:#16A34A;--amber:#CA8A04;--red:#DC2626;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
  h1{font-size:20px;font-weight:700}.sub{color:var(--muted);font-size:13px;margin-top:2px}
  .wrap{max-width:1180px;margin:18px auto 0}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
  .tab .em{font-size:17px}
  .tab.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand);box-shadow:0 1px 3px rgba(37,99,235,.15)}

  .grid{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
  @media(max-width:840px){.grid{grid-template-columns:1fr}}

  /* step rail */
  .rail{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px}
  .rail h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
  .rstep{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--muted)}
  .rstep:hover{background:#f8fafc}
  .rstep.cur{background:var(--brand-50);color:var(--brand);font-weight:700}
  .rstep.done{color:var(--ink)}
  .rdot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#e2e8f0;color:#94a3b8;flex:none}
  .rstep.done .rdot{background:var(--green);color:#fff}
  .rstep.cur .rdot{background:var(--brand);color:#fff}
  .railcaps{margin-top:16px;border-top:1px dashed var(--border);padding-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .ccap{font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:7px;background:#f1f5f9;color:#475569}

  /* phone */
  .stage{display:flex;justify-content:center}
  .phone{width:340px;background:#0f172a;border-radius:40px;padding:11px;box-shadow:0 22px 55px rgba(2,6,23,.25)}
  .screen{background:#f4f6fa;border-radius:30px;overflow:hidden;height:660px;display:flex;flex-direction:column;position:relative}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#0f172a;border-radius:0 0 15px 15px;z-index:6}
  .mhead{background:#fff;border-bottom:1px solid var(--border);padding:32px 16px 12px;display:flex;align-items:center;gap:10px}
  .mback{width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:16px;flex:none}
  .mhmid{flex:1;min-width:0}
  .mhmid .tt{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stbadge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:3px}
  .mbody{flex:1;overflow-y:auto;padding:15px}
  .mfoot{border-top:1px solid var(--border);padding:12px 15px;background:#fff}
  .act{width:100%;height:46px;border-radius:14px;background:var(--brand);color:#fff;border:0;font:inherit;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .act.go{background:#0f172a}.act.done{background:var(--green)}.act.final{background:var(--green)}

  /* building blocks */
  .card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:14px;margin-bottom:12px}
  .card.flush{padding:0;overflow:hidden}
  .crow{display:flex;align-items:center;gap:10px;padding:9px 0}
  .crow+.crow{border-top:1px solid #f1f5f9}
  .crow .ic{width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .crow .k{font-size:11px;color:var(--muted)}
  .crow .v{font-size:13px;font-weight:600}
  .crow .r{margin-left:auto;text-align:right}
  .sect{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 2px 8px}
  .hero{text-align:center;padding:22px 12px}
  .hero .big{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
  .hero h2{font-size:18px;font-weight:700}
  .hero p{font-size:12px;color:var(--muted);margin-top:4px}
  .p{font-size:12.5px;color:#475569;line-height:1.5}
  .pri{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px}
  .map{height:150px;border-radius:13px;background:linear-gradient(135deg,#dbeafe,#e0f2fe 60%,#eff6ff);position:relative;overflow:hidden;margin-bottom:12px;border:1px solid #dbeafe}
  .map .pin{position:absolute;top:42%;left:48%;font-size:24px}
  .map .me{position:absolute;bottom:18%;left:18%;width:14px;height:14px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 5px rgba(37,99,235,.2)}
  .map .rt{position:absolute;left:22%;bottom:25%;width:50%;height:3px;background:var(--brand);transform:rotate(-20deg);border-radius:2px}
  .eta{display:flex;gap:10px;margin-bottom:12px}
  .eta .b{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
  .eta .b .n{font-size:17px;font-weight:700}.eta .b .l{font-size:10px;color:var(--muted)}
  .timer{display:flex;align-items:center;gap:9px;background:#0f172a;color:#fff;border-radius:13px;padding:12px 14px;margin-bottom:12px}
  .timer .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .timer .l{font-size:10px;color:#94a3b8;margin-left:auto}
  .ckrow{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 0}
  .ckrow+.ckrow{border-top:1px solid #f1f5f9}
  .ckbox{width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .ckbox.x{background:var(--green);border-color:var(--green)}
  .ckbox.f{background:var(--red);border-color:var(--red)}
  .ckrow .pf{margin-left:auto;display:flex;gap:5px}
  .tagp{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
  .tagp.p{background:#dcfce7;color:#15803d}.tagp.f{background:#fee2e2;color:#b91c1c}
  .photos{display:flex;gap:9px;flex-wrap:wrap}
  .psq{width:58px;height:58px;border-radius:11px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:20px;color:#94a3b8;border:1px dashed #cbd5e1}
  .psq.f{border:none;background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
  .sign{height:80px;border-radius:11px;border:2px dashed #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#94a3b8;font-style:italic;background:#fff}
  .field{margin-bottom:10px}
  .field .l{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
  .field .in{border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12.5px;color:#475569;background:#fff}
  .field .in.area{height:54px}
  .pick{border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;background:#fff}
  .progress{height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:4px 0 12px}
  .progress .f{height:100%;background:var(--brand);border-radius:99px}
  .stat2{display:flex;gap:10px;margin-bottom:12px}
  .stat2 .b{flex:1;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;background:#fff}
  .stat2 .b .n{font-size:20px;font-weight:700}.stat2 .b .l{font-size:10px;color:var(--muted)}
  .banner{border-radius:12px;padding:11px 13px;font-size:12px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:9px}
  .banner.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
  .banner.info{background:var(--brand-50);color:var(--brand-700);border:1px solid #bfdbfe}
</style>
</head>
<body>
  <div style="max-width:1180px;margin:0 auto">
    <h1>Dynamic Task Types — real flow screens</h1>
    <p class="sub">Every status in the flow is its own screen with its own UI &amp; data — driven by the task's <b>workflow + capabilities</b>. Pick a type, then walk the steps.</p>
  </div>

  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div class="grid">
      <div class="rail">
        <h4 id="rail-name"></h4>
        <div id="rail-steps"></div>
        <div class="railcaps" id="rail-caps"></div>
      </div>
      <div class="stage">
        <div class="phone"><div class="screen">
          <div class="notch"></div>
          <div class="mhead">
            <div class="mback">‹</div>
            <div class="mhmid"><div class="tt" id="m-title"></div><span class="stbadge" id="m-status"></span></div>
          </div>
          <div class="mbody" id="m-body"></div>
          <div class="mfoot"><button class="act" id="m-act"></button></div>
        </div></div>
      </div>
    </div>
  </div>

<script>
const CAPS={gps:'📍 GPS',timer:'⏱️ Timer',checklist:'✅ Checklist',photos:'📷 Photos',signature:'✍️ Signature',report:'📝 Report',form:'🗒️ Form'};

// helpers ------------------------------------------------------------------
function row(ic,k,v,r){return `<div class="crow"><span class="ic">${ic}</span><div><div class="k">${k}</div><div class="v">${v}</div></div>${r?`<div class="r v">${r}</div>`:''}</div>`}
function card(inner){return `<div class="card">${inner}</div>`}
function hero(bg,em,h,p){return `<div class="hero"><div class="big" style="background:${bg.b};color:${bg.c}">${em}</div><h2>${h}</h2><p>${p}</p></div>`}
function map(eta,dist){return `<div class="map"><div class="rt"></div><div class="me"></div><div class="pin">📍</div></div><div class="eta"><div class="b"><div class="n">${eta}</div><div class="l">ETA</div></div><div class="b"><div class="n">${dist}</div><div class="l">distance</div></div></div>`}
function timer(v){return `<div class="timer">⏱️ <span class="v">${v}</span><span class="l">since accepted</span></div>`}
function ck(items){return `<div class="card">${items.map(([t,s])=>`<div class="ckrow"><span class="ckbox ${s||''}">${s==='x'?'✓':s==='f'?'✕':''}</span>${t}</div>`).join('')}</div>`}
function ckpf(items){return `<div class="card">${items.map(([t,s])=>`<div class="ckrow"><span class="ckbox ${s}">${s==='x'?'✓':s==='f'?'✕':''}</span>${t}<span class="pf">${s==='x'?'<span class="tagp p">PASS</span>':s==='f'?'<span class="tagp f">FAIL</span>':''}</span></div>`).join('')}</div>`}
function photos(filled){return `<div class="photos">${[0,1,2].map(i=>`<div class="psq ${i<filled?'f':''}">${i<filled?'🖼️':'＋'}</div>`).join('')}</div>`}
function sign(){return `<div class="sign">✍️ Sign here</div>`}

const PRI={field:'<span class="pri" style="background:#fff7ed;color:#c2410c">▲ HIGH</span>'};

// per-type, per-step screens ----------------------------------------------
const FLOWS={
  field:{ em:'🔧', name:'Field Service', title:'HVAC System Maintenance',
    statuses:['Assigned','Accepted','En route','Arrived','In progress','Completed'],
    caps:['gps','timer','photos','report','signature'],
    colors:['#64748b','#2563EB','#2563EB','#7c3aed','#CA8A04','#16A34A'],
    screen:(s)=>[
      {a:'Accept task',cls:'',body:
        card(row('🏢','Customer','Acme Offices GmbH')+row('📍','Address','Arbeiterheimstraße 32','HIGH'.replace('HIGH',''))+row('📅','Scheduled','Today · 14:00')+row('🔺','Priority','High'))+
        `<div class="sect">Job details</div>`+card(`<div class="p">Quarterly maintenance of rooftop HVAC unit. Replace filters, check refrigerant, inspect belts.</div>`)},
      {a:'Start driving',cls:'go',body:
        `<div class="banner ok">✅ Job accepted — head to the customer</div>`+
        card(row('🏢','Acme Offices GmbH','Arbeiterheimstraße 32')+row('📞','Contact','Mr. Berger','Call'))},
      {a:'I have arrived',cls:'',body: map('12 min','4.2 km')+card(row('🏢','Destination','Arbeiterheimstraße 32')+row('📞','Customer','Mr. Berger','Call'))},
      {a:'Start work',cls:'',body: hero({b:'#dcfce7',c:'#16a34a'},'📍','You have arrived','Checked in at 13:58 · Main Office')+
        `<div class="sect">Before you start</div>`+`<div class="card"><div class="p">Take a few <b>before</b> photos of the unit.</div><div style="margin-top:10px">${photos(0)}</div></div>`},
      {a:'Complete job',cls:'done',body: timer('1h 12m')+`<div class="sect">Checklist</div>`+ck([['Replace air filters','x'],['Check refrigerant level','x'],['Inspect drive belts',''],['Clean condenser coils','']])+
        `<div class="sect">Before photos</div>`+card(photos(2))},
      {a:'Submit report',cls:'final',body:`<div class="sect">Service report</div>`+
        card(`<div class="field"><span class="l">Work performed</span><div class="in area">Replaced 2 filters, topped up refrigerant, cleaned coils. Belt OK.</div></div><div class="field"><span class="l">Parts used</span><div class="in">2× Filter F7 · 1× Refrigerant R-410A</div></div>`)+
        `<div class="sect">After photos</div>`+card(photos(2))+`<div class="sect">Customer signature</div>`+card(sign())},
    ][s]
  },
  logistics:{ em:'🚚', name:'Logistics / delivery', title:'Deliver order #4821',
    statuses:['Assigned','Accepted','Picked up','In transit','Delivered'],
    caps:['gps','timer','photos','signature'],
    colors:['#64748b','#2563EB','#0891b2','#2563EB','#16A34A'],
    screen:(s)=>[
      {a:'Accept delivery',cls:'',body:
        card(row('📦','Order','#4821','6 items')+row('🏭','Pick up','Central Warehouse')+row('🏠','Deliver to','12 Main St, Gmunden')+row('👤','Recipient','L. Wagner'))},
      {a:'Confirm pickup',cls:'go',body:`<div class="banner info">🏭 Go to the warehouse to collect</div>`+map('6 min','2.1 km')+card(row('🏭','Central Warehouse','Bay 3 · Dock A'))},
      {a:'Start delivery',cls:'',body:`<div class="sect">Scan / confirm 6 items</div>`+ck([['Box A — electronics','x'],['Box B — accessories','x'],['Box C — manuals','x'],['Pallet wrap','x'],['Fragile sticker','x'],['Invoice copy','x']])},
      {a:'Mark delivered',cls:'done',body: map('9 min','5.4 km')+card(row('🏠','12 Main St, Gmunden','Apartment 4B')+row('👤','Recipient','L. Wagner','Call'))},
      {a:'Complete delivery',cls:'final',body:`<div class="sect">Proof of delivery</div>`+
        card(`<div class="p">Photo of the delivered package at the door.</div><div style="margin-top:10px">${photos(1)}</div>`)+
        `<div class="sect">Recipient signature</div>`+card(`<div class="field"><span class="l">Received by</span><div class="in">L. Wagner</div></div>${sign()}`)},
    ][s]
  },
  office:{ em:'🗂️', name:'Office / admin', title:'Prepare Q3 report',
    statuses:['To-do','Doing','Done'],
    caps:['timer','checklist'],
    colors:['#64748b','#2563EB','#16A34A'],
    screen:(s)=>[
      {a:'Start',cls:'',body:
        card(`<div class="p">Compile the Q3 financial summary and circulate to the leadership team before Friday.</div>`)+
        card(row('📅','Due','Fri · 17:00')+row('🏷️','Type','Office task'))+
        `<div class="sect">Checklist (0/3)</div>`+ck([['Pull Q3 numbers',''],['Draft summary deck',''],['Send for review','']])},
      {a:'Mark done',cls:'done',body: timer('48m')+
        `<div class="sect">Checklist (1/3)</div>`+`<div class="progress"><div class="f" style="width:33%"></div></div>`+
        ck([['Pull Q3 numbers','x'],['Draft summary deck',''],['Send for review','']])+
        card(`<div class="field"><span class="l">Notes</span><div class="in area">Waiting on October figures from finance…</div></div>`)},
      {a:'Close task',cls:'final',body: hero({b:'#dcfce7',c:'#16a34a'},'✅','Task done','Completed in 2h 04m')+
        `<div class="stat2"><div class="b"><div class="n">3/3</div><div class="l">checklist</div></div><div class="b"><div class="n">2h 04m</div><div class="l">time spent</div></div></div>`},
    ][s]
  },
  sales:{ em:'🤝', name:'Sales / visit', title:'Visit ACME Corp',
    statuses:['Scheduled','En route','Visited','Outcome'],
    caps:['gps','timer','form'],
    colors:['#64748b','#2563EB','#0891b2','#16A34A'],
    screen:(s)=>[
      {a:'Start visit',cls:'go',body:
        card(row('🏢','Company','ACME Corp')+row('👤','Contact','Sofia Klein · Buyer')+row('📅','Scheduled','Today · 11:00')+row('📞','Phone','+43 …','Call'))+
        `<div class="sect">Agenda</div>`+card(`<div class="p">Present new service tiers · discuss renewal · gather requirements.</div>`)},
      {a:'I have arrived',cls:'',body: map('8 min','3.0 km')+card(row('🏢','ACME Corp','Stadtplatz 7')+row('👤','Sofia Klein','Buyer'))},
      {a:'Log outcome',cls:'done',body:`<div class="banner ok">📍 Checked in at ACME Corp · 11:03</div>`+timer('22m')+
        `<div class="sect">Visit form</div>`+card(`<div class="field"><span class="l">Outcome</span><div class="pick">Interested — quote requested <span>▾</span></div></div><div class="field"><span class="l">Notes</span><div class="in area">Wants 3-year pricing. Decision by Q4.</div></div><div class="field"><span class="l">Next step</span><div class="pick">Send proposal · follow up Fri <span>▾</span></div></div>`)},
      {a:'Finish',cls:'final',body: hero({b:'#dbeafe',c:'#2563EB'},'🤝','Visit logged','ACME Corp · 22 min on site')+
        card(row('🎯','Outcome','Interested — quote requested')+row('📅','Follow up','Friday')+row('📍','Check-in','Verified by GPS'))},
    ][s]
  },
  inspection:{ em:'✅', name:'Inspection / audit', title:'Monthly safety audit',
    statuses:['Assigned','In progress','Submitted'],
    caps:['checklist','photos','signature','timer'],
    colors:['#64748b','#CA8A04','#16A34A'],
    screen:(s)=>[
      {a:'Start inspection',cls:'',body:
        card(row('📍','Location','Warehouse — Gmunden')+row('📋','Checkpoints','8 items')+row('📐','Standard','ISO 45001')+row('📅','Due','Today'))},
      {a:'Submit audit',cls:'done',body: timer('17m')+
        `<div class="sect">Checkpoints (6/8)</div>`+`<div class="progress"><div class="f" style="width:75%"></div></div>`+
        ckpf([['Fire extinguisher present','x'],['Emergency exit clear','x'],['First-aid kit stocked','f'],['PPE available','x']])+
        `<div class="sect">Evidence (failed item)</div>`+card(photos(1))},
      {a:'Finish audit',cls:'final',body:`<div class="stat2"><div class="b"><div class="n" style="color:#16a34a">6</div><div class="l">passed</div></div><div class="b"><div class="n" style="color:#dc2626">1</div><div class="l">failed</div></div><div class="b"><div class="n">1</div><div class="l">photo</div></div></div>`+
        `<div class="sect">Issue found</div>`+card(`<div class="p">First-aid kit not stocked — flagged for restock.</div>`)+
        `<div class="sect">Inspector sign-off</div>`+card(sign())},
    ][s]
  },
};

const state={type:'field',step:0};

const tabsEl=document.getElementById('tabs');
Object.entries(FLOWS).forEach(([k,f])=>{
  const b=document.createElement('button');
  b.className='tab'+(k===state.type?' on':'');
  b.innerHTML=`<span class="em">${f.em}</span> ${f.name}`;
  b.onclick=()=>{state.type=k;state.step=0;[...tabsEl.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');render();};
  tabsEl.appendChild(b);
});

function render(){
  const f=FLOWS[state.type];
  const last=f.statuses.length-1;
  const color=f.colors[state.step];

  // rail
  document.getElementById('rail-name').innerHTML=`${f.em} ${f.name}`;
  document.getElementById('rail-steps').innerHTML=f.statuses.map((s,i)=>{
    const cls=i<state.step?'done':(i===state.step?'cur':'');
    return `<div class="rstep ${cls}" data-i="${i}"><span class="rdot">${i<state.step?'✓':i+1}</span>${s}</div>`;
  }).join('');
  document.querySelectorAll('.rstep').forEach(el=>el.onclick=()=>{state.step=+el.dataset.i;render();});
  document.getElementById('rail-caps').innerHTML=f.caps.map(c=>`<span class="ccap">${CAPS[c]}</span>`).join('');

  // phone
  document.getElementById('m-title').textContent=f.title;
  const st=document.getElementById('m-status');
  st.textContent=f.statuses[state.step];
  st.style.background=color+'1f'; st.style.color=color;

  const scr=f.screen(state.step);
  document.getElementById('m-body').innerHTML=scr.body;

  const act=document.getElementById('m-act');
  act.className='act '+(scr.cls||'');
  act.textContent=scr.a;
  act.onclick=()=>{ state.step = state.step<last ? state.step+1 : 0; render(); };
}
render();
</script>
</body>
</html>
