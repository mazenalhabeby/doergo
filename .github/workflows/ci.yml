name: CI

# Everything a release depends on, on every PR and every push to main:
#   release-tools   migration safety, image build invariants, workflow lint,
#                   and the release scripts' own tests
#   typecheck       tsc --noEmit in every app
#   test            jest in every app (guard specs included — they are specs)
#   quarantined     the few test files allowed to fail, reported, never gating
#   web-build       the production Next.js build (pnpm build:check)
#   security        pnpm audit
#
# The Deploy workflow refuses a commit whose CI did not pass.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tools:
    name: Release tools & migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22: the release scripts are TypeScript run by Node's type stripping,
      # with no build step and no dependencies of their own.
      - uses: ./.github/actions/setup
        with:
          node-version: '22'
          build-shared: 'false'
          prisma: 'false'

      - name: Migrations are additive
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            # A new branch, or a force push that dropped history.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD~1"
            fi
          fi
          echo "comparing migrations against $base"
          node tools/release/check-migrations.ts --base "$base" --head HEAD

      - name: Image build invariants (compose ↔ Dockerfile ↔ images workflow)
        run: node tools/release/check-images.ts

      - name: Release scripts — typecheck
        working-directory: tools/release
        run: ../../node_modules/.bin/tsc -p tsconfig.json

      - name: Release scripts — tests
        working-directory: tools/release
        run: node --test check-migrations.test.ts mobile-change-kind.test.ts check-images.test.ts deploy-sh.test.ts

      - name: Lint workflows (actionlint + shellcheck)
        # Scripts inside workflows are shellchecked at warning level; style and
        # info notes (quoting suggestions on ssh commands and the like) do not gate.
        run: docker run --rm -e SHELLCHECK_OPTS="-S warning" -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Shell scripts (shellcheck)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -S warning \
            infra/release/deploy.sh infra/release/preflight.d/*.sh tools/release/fixtures/*.sh

      - name: Translation slot widths
        run: pnpm i18n:check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: tsc --noEmit in every app
        run: |
          failed=""
          for app in apps/api/gateway apps/api/auth-service apps/api/task-service apps/api/notification-service apps/api/tracking-service apps/web-app apps/admin apps/mobile; do
            echo "::group::tsc $app"
            if (cd "$app" && npx tsc --noEmit -p tsconfig.json); then echo "ok"; else failed="$failed $app"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::tsc failed in:$failed"; exit 1; fi

  test:
    name: Test ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/api/gateway
          - apps/api/auth-service
          - apps/api/task-service
          - apps/api/notification-service
          - apps/api/tracking-service
          - apps/web-app
          - apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: jest
        working-directory: ${{ matrix.app }}
        env:
          NODE_OPTIONS: --experimental-vm-modules
          APP: ${{ matrix.app }}
        run: |
          # Quarantined files are excluded here and run in the Quarantined job.
          ignore="$(jq -r --arg app "$APP" '.tests[] | select(.app == $app) | .path' "$GITHUB_WORKSPACE/tools/release/quarantined-tests.json" | sed 's/[.]/\\./g' | paste -sd'|' -)"
          if [ -n "$ignore" ]; then
            echo "quarantined (not gating): $ignore"
            npx jest --ci --maxWorkers=2 --testPathIgnorePatterns "$ignore"
          else
            npx jest --ci --maxWorkers=2
          fi

  quarantined:
    name: Quarantined tests (not gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run each quarantined file and report
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: |
          jq -c '.tests[]' tools/release/quarantined-tests.json | while read -r entry; do
            app="$(echo "$entry" | jq -r .app)"; path="$(echo "$entry" | jq -r .path)"
            if (cd "$app" && npx jest --ci "$path"); then
              echo "::warning file=$app/$path::now PASSES — remove it from tools/release/quarantined-tests.json so it gates again"
            else
              echo "::warning file=$app/$path::still failing (quarantined: $(echo "$entry" | jq -r .reason | cut -c1-120)…)"
            fi
          done

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          prisma: 'false'
      - name: pnpm build:check
        working-directory: apps/web-app
        env:
          NEXT_PUBLIC_API_URL: https://hbcfield.com/api/v1
          NEXT_PUBLIC_AUTH_URL: https://hbcfield.com/api/v1
          NEXT_PUBLIC_SOCKET_URL: https://hbcfield.com
        run: pnpm build:check

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-shared: 'false'
          prisma: 'false'
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
