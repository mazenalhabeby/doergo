# HBCField Production Docker Compose
# Usage: docker compose --env-file .env.production up -d
# Note: Nginx runs on the host (not in Docker) to share with other apps

# Log rotation (audit) — cap every container's json-file logs so verbose request
# logging can't fill the disk on this shared box. 10MB × 3 files = 30MB/service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: hbcfield-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hbcfield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hbcfield}
    # Slow-query visibility. Production had NONE: pg_stat_statements was not
    # loaded and log_min_duration_statement was -1, so "which query is slow?" had
    # no answer and no way to get one. You cannot tune what you cannot see.
    #   · pg_stat_statements — cumulative per-statement timings, the thing to read
    #     first when the box is busy. Needs shared_preload_libraries, hence a
    #     restart, and `CREATE EXTENSION pg_stat_statements;` once per database.
    #   · log_min_duration_statement=1000 — log any statement over a second.
    #     Deliberately not lower: at 0 this logs every statement and the log volume
    #     becomes its own performance problem.
    #   · track_io_timing — separates "slow because of CPU" from "slow because of
    #     disk", which is the first question about any slow query.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=1000
      - -c
      - track_io_timing=on
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - hbcfield_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hbcfield} -d ${POSTGRES_DB:-hbcfield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - hbcfield-network

  redis:
    image: redis:7-alpine
    container_name: hbcfield-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Consumed by the healthcheck below (via $$ runtime expansion, not compose
      # interpolation) so the ping authenticates. (Sec audit H14.)
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - hbcfield_redis_data:/data
    # requirepass (H14): the bus + auth cache + queues ride on Redis on a host
    # shared with ~30 other containers. Without AUTH anything on the box could
    # publish {cmd} messages that bypass every gateway guard. Loopback binding
    # alone is not sufficient isolation on a shared host.
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hbcfield-network

  # Connection pooler — multiplexes many app connections onto a small pool of
  # Postgres connections (transaction mode), so the services scale well past
  # Postgres's 100-connection limit. Prisma runtime URLs use ?pgbouncer=true;
  # migrations bypass it via DIRECT_DATABASE_URL.
  pgbouncer:
    # Pinned to a digest (audit) — pgbouncer sits in the DB path; a floating
    # :latest could pull a breaking build on a future recreate. Same image
    # currently running. Bump deliberately when upgrading.
    image: edoburu/pgbouncer:latest@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    container_name: hbcfield-pgbouncer
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-hbcfield}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DB_NAME=${POSTGRES_DB:-hbcfield}
      - POOL_MODE=transaction
      - LISTEN_PORT=6432
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - AUTH_TYPE=scram-sha-256
      - ADMIN_USERS=${POSTGRES_USER:-hbcfield}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - hbcfield-network

  # ==================== BACKEND SERVICES ====================
  auth-service:
    build:
      context: ../../
      dockerfile: apps/api/auth-service/Dockerfile
    container_name: hbcfield-auth-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-hbcfield}?schema=public&pgbouncer=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-15m}
      # Role is the sole source of permissions; the legacy per-member
      # columns are no longer read. Unset to fall back within one restart.
      #
      # This lived only in the copy on the production box, which meant
      # deploying this file would have quietly turned it off and handed every
      # member their pre-migration permissions back.
      - ACCESS_IGNORE_LEGACY_FLAGS=${ACCESS_IGNORE_LEGACY_FLAGS:-false}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-90d}
      # Platform-staff auth (admin.hbcfield.com) — SEPARATE secret from customer JWT.
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET}
      # C3 live-Stripe pricing sync — DISABLED unless explicitly 'true' (after a
      # test-clock rehearsal). Off = apply refuses; preview is always read-only.
      - PLATFORM_PRICING_SYNC_ENABLED=${PLATFORM_PRICING_SYNC_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@hbcfield.com}
      - SMTP_SECURE=${SMTP_SECURE:-}
      # Second provider, tried when the first refuses the message. Leaving these
      # unset keeps the single-provider behaviour exactly as it was.
      - SMTP_FALLBACK_HOST=${SMTP_FALLBACK_HOST:-}
      - SMTP_FALLBACK_PORT=${SMTP_FALLBACK_PORT:-587}
      - SMTP_FALLBACK_USER=${SMTP_FALLBACK_USER:-}
      - SMTP_FALLBACK_PASS=${SMTP_FALLBACK_PASS:-}
      - SMTP_FALLBACK_SECURE=${SMTP_FALLBACK_SECURE:-}
      - SMTP_FALLBACK_FROM=${SMTP_FALLBACK_FROM:-}
      - APP_URL=https://${DOMAIN:-hbcfield.hbc-solution.io}
      # Direct (non-pooled) connection used ONLY for `prisma migrate deploy` at startup.
      - DIRECT_DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-hbcfield}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  task-service:
    build:
      context: ../../
      dockerfile: apps/api/task-service/Dockerfile
    container_name: hbcfield-task-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-hbcfield}?schema=public&pgbouncer=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-hbcfield}
      - S3_REGION=${S3_REGION:-eu-central-1}
      # The gateway, in-network. Used for the "Remote · city" label on a
      # clock-in, which goes through its /geo/reverse so the geocoder chain
      # lives in one place. Unreachable simply means no place name is recorded.
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://api-gateway:4000/api/v1}
      # AI reports (Phase 4) — natural-language → report via Claude. Optional:
      # feature returns a graceful 402/400 until this is set in .env.production.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Retention (opt-in). Nightly prune when set to a positive day count;
      # unset = never delete (preserves task-timeline + audit history). (P10)
      - TASK_EVENT_RETENTION_DAYS=${TASK_EVENT_RETENTION_DAYS:-}
      - ACTIVITY_LOG_RETENTION_DAYS=${ACTIVITY_LOG_RETENTION_DAYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  notification-service:
    build:
      context: ../../
      dockerfile: apps/api/notification-service/Dockerfile
    container_name: hbcfield-notification-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-hbcfield}?schema=public&pgbouncer=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Required by the websocket gateway to verify JWTs on socket connections.
      # Must match the auth-service / gateway value (same secret signs the tokens).
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      # Platform-staff JWT — lets admin.hbcfield.com agents authenticate the socket.
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@hbcfield.com}
      - SMTP_SECURE=${SMTP_SECURE:-}
      # Second provider, tried when the first refuses the message. Leaving these
      # unset keeps the single-provider behaviour exactly as it was.
      - SMTP_FALLBACK_HOST=${SMTP_FALLBACK_HOST:-}
      - SMTP_FALLBACK_PORT=${SMTP_FALLBACK_PORT:-587}
      - SMTP_FALLBACK_USER=${SMTP_FALLBACK_USER:-}
      - SMTP_FALLBACK_PASS=${SMTP_FALLBACK_PASS:-}
      - SMTP_FALLBACK_SECURE=${SMTP_FALLBACK_SECURE:-}
      - SMTP_FALLBACK_FROM=${SMTP_FALLBACK_FROM:-}
      - SOCKET_CORS_ORIGINS=https://${DOMAIN:-hbcfield.hbc-solution.io}
      - SOCKET_ADMIN_USER=${SOCKET_ADMIN_USER:-}
      - SOCKET_ADMIN_PASSWORD=${SOCKET_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  tracking-service:
    build:
      context: ../../
      dockerfile: apps/api/tracking-service/Dockerfile
    container_name: hbcfield-tracking-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@pgbouncer:6432/${POSTGRES_DB:-hbcfield}?schema=public&pgbouncer=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hbcfield-network

  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api/gateway/Dockerfile
    container_name: hbcfield-api-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - CORS_ORIGINS=https://${DOMAIN:-hbcfield.hbc-solution.io}
      # Route optimizer (CRM). Deliberately EMPTY by default: the public OSRM
      # demo host is not licensed for production traffic, and pointing at it
      # would send every customer address to a third party. Unset, the optimizer
      # orders stops by nearest-neighbour. Set OSRM_URL in .env.production to a
      # self-hosted OSRM (or a provider you have a contract with) for real road
      # distances.
      - OSRM_URL=${OSRM_URL:-}
      # Geocoding. Google serves BOTH halves — Places API for address search,
      # Geocoding API for reverse — and needs both enabled on the key.
      #
      # This was missing entirely: the key sat in .env.production and never
      # reached the container, so GOOGLE_KEY was '' and Photon was silently
      # doing all of it behind a default URL. Nothing said so.
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      # Self-hosted Photon geocoder, OPTIONAL. Unset = Google is the only
      # geocoder. Set it only while a Photon container is actually running;
      # see docker-compose.photon.yml.
      - PHOTON_URL=${PHOTON_URL:-}
    depends_on:
      auth-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network
    # Uploaded avatars/media are written to /app/uploads by the gateway. Without
    # a persistent volume they live only in the container layer and are WIPED on
    # every recreate/redeploy. A named volume seeds from the existing dir on
    # first mount and survives redeploys.
    volumes:
      - hbcfield_uploads:/app/uploads

  # ==================== WEB APP ====================
  web-app:
    build:
      context: ../../
      dockerfile: apps/web-app/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-hbcfield.hbc-solution.io}/api/v1
        # Auth + socket calls are made from the browser; without these they fall
        # back to localhost and break in production. Same origin as the API.
        - NEXT_PUBLIC_AUTH_URL=https://${DOMAIN:-hbcfield.hbc-solution.io}/api/v1
        - NEXT_PUBLIC_SOCKET_URL=https://${DOMAIN:-hbcfield.hbc-solution.io}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
        # Map tiles. Unset falls back to OpenStreetMap's public servers, which
        # their usage policy does not permit for commercial traffic — set both
        # in .env.production. The attribution is a licence condition of whatever
        # host you use, not a preference.
        - NEXT_PUBLIC_MAP_TILE_URL=${MAP_TILE_URL:-}
        - NEXT_PUBLIC_MAP_TILE_ATTRIBUTION=${MAP_TILE_ATTRIBUTION:-}
    container_name: hbcfield-web-app
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'next-server' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  # Platform Control Center — independent, minimal admin app at admin.hbcfield.com.
  # Same backend (api-gateway); calls its own origin /api/v1 (nginx proxies it) so
  # there's no CORS. Hidden internal tool — put Cloudflare Access / IP-allowlist in
  # front of the admin.hbcfield.com vhost.
  admin-app:
    build:
      context: ../../
      dockerfile: apps/admin/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://admin.${DOMAIN:-hbcfield.com}/api/v1
    container_name: hbcfield-admin-app
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=production
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'next-server' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - hbcfield-network

volumes:
  hbcfield_postgres_data:
    name: hbcfield-postgres-data
  hbcfield_redis_data:
    name: hbcfield-redis-data
  hbcfield_uploads:
    name: hbcfield-uploads

networks:
  hbcfield-network:
    name: hbcfield-network
    driver: bridge
