# Doergo Production Docker Compose
# Usage: docker compose --env-file .env.production up -d

services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: doergo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doergo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doergo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-doergo}
    volumes:
      - doergo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doergo} -d ${POSTGRES_DB:-doergo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - doergo-network

  redis:
    image: redis:7-alpine
    container_name: doergo-redis
    restart: unless-stopped
    volumes:
      - doergo_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - doergo-network

  # ==================== BACKEND SERVICES ====================
  auth-service:
    build:
      context: ../../
      dockerfile: apps/api/auth-service/Dockerfile
    container_name: doergo-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-doergo}:${POSTGRES_PASSWORD:-doergo_secret}@postgres:5432/${POSTGRES_DB:-doergo}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-24h}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@doergo.com}
      - APP_URL=https://${DOMAIN:-doergo.hbc-solution.io}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - doergo-network

  task-service:
    build:
      context: ../../
      dockerfile: apps/api/task-service/Dockerfile
    container_name: doergo-task-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-doergo}:${POSTGRES_PASSWORD:-doergo_secret}@postgres:5432/${POSTGRES_DB:-doergo}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-doergo}
      - S3_REGION=${S3_REGION:-eu-central-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - doergo-network

  notification-service:
    build:
      context: ../../
      dockerfile: apps/api/notification-service/Dockerfile
    container_name: doergo-notification-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-doergo}:${POSTGRES_PASSWORD:-doergo_secret}@postgres:5432/${POSTGRES_DB:-doergo}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SOCKET_CORS_ORIGINS=https://${DOMAIN:-doergo.hbc-solution.io}
      - SOCKET_ADMIN_USER=${SOCKET_ADMIN_USER:-}
      - SOCKET_ADMIN_PASSWORD=${SOCKET_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - doergo-network

  tracking-service:
    build:
      context: ../../
      dockerfile: apps/api/tracking-service/Dockerfile
    container_name: doergo-tracking-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-doergo}:${POSTGRES_PASSWORD:-doergo_secret}@postgres:5432/${POSTGRES_DB:-doergo}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - doergo-network

  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api/gateway/Dockerfile
    container_name: doergo-api-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - CORS_ORIGINS=https://${DOMAIN:-doergo.hbc-solution.io}
    depends_on:
      auth-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - doergo-network

  # ==================== WEB APP ====================
  web-app:
    build:
      context: ../../
      dockerfile: apps/web-app/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-doergo.hbc-solution.io}/api/v1
    container_name: doergo-web-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - doergo-network

  # ==================== REVERSE PROXY ====================
  nginx:
    image: nginx:1.27-alpine
    container_name: doergo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - doergo_certbot_conf:/etc/letsencrypt:ro
      - doergo_certbot_www:/var/www/certbot:ro
    depends_on:
      web-app:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - doergo-network

  # Let's Encrypt certificate renewal
  certbot:
    image: certbot/certbot
    container_name: doergo-certbot
    volumes:
      - doergo_certbot_conf:/etc/letsencrypt
      - doergo_certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - doergo-network

volumes:
  doergo_postgres_data:
    name: doergo-postgres-data
  doergo_redis_data:
    name: doergo-redis-data
  doergo_certbot_conf:
    name: doergo-certbot-conf
  doergo_certbot_www:
    name: doergo-certbot-www

networks:
  doergo-network:
    name: doergo-network
    driver: bridge
