# HBCField Production Docker Compose
# Usage: docker compose --env-file .env.production up -d
# Note: Nginx runs on the host (not in Docker) to share with other apps

services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: hbcfield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hbcfield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hbcfield_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hbcfield}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - hbcfield_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hbcfield} -d ${POSTGRES_DB:-hbcfield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - hbcfield-network

  redis:
    image: redis:7-alpine
    container_name: hbcfield-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hbcfield_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hbcfield-network

  # ==================== BACKEND SERVICES ====================
  auth-service:
    build:
      context: ../../
      dockerfile: apps/api/auth-service/Dockerfile
    container_name: hbcfield-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:-hbcfield_secret}@postgres:5432/${POSTGRES_DB:-hbcfield}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-24h}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@hbcfield.com}
      - APP_URL=https://${DOMAIN:-hbcfield.hbc-solution.io}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  task-service:
    build:
      context: ../../
      dockerfile: apps/api/task-service/Dockerfile
    container_name: hbcfield-task-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:-hbcfield_secret}@postgres:5432/${POSTGRES_DB:-hbcfield}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-hbcfield}
      - S3_REGION=${S3_REGION:-eu-central-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  notification-service:
    build:
      context: ../../
      dockerfile: apps/api/notification-service/Dockerfile
    container_name: hbcfield-notification-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:-hbcfield_secret}@postgres:5432/${POSTGRES_DB:-hbcfield}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@hbcfield.com}
      - SOCKET_CORS_ORIGINS=https://${DOMAIN:-hbcfield.hbc-solution.io}
      - SOCKET_ADMIN_USER=${SOCKET_ADMIN_USER:-}
      - SOCKET_ADMIN_PASSWORD=${SOCKET_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  tracking-service:
    build:
      context: ../../
      dockerfile: apps/api/tracking-service/Dockerfile
    container_name: hbcfield-tracking-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hbcfield}:${POSTGRES_PASSWORD:-hbcfield_secret}@postgres:5432/${POSTGRES_DB:-hbcfield}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hbcfield-network

  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api/gateway/Dockerfile
    container_name: hbcfield-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - CORS_ORIGINS=https://${DOMAIN:-hbcfield.hbc-solution.io}
    depends_on:
      auth-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)throw r;process.exit(0)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

  # ==================== WEB APP ====================
  web-app:
    build:
      context: ../../
      dockerfile: apps/web-app/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-hbcfield.hbc-solution.io}/api/v1
    container_name: hbcfield-web-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'next-server' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - hbcfield-network

volumes:
  hbcfield_postgres_data:
    name: hbcfield-postgres-data
  hbcfield_redis_data:
    name: hbcfield-redis-data

networks:
  hbcfield-network:
    name: hbcfield-network
    driver: bridge
