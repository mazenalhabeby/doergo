# Self-hosted Photon geocoder (full-planet index) for location search.
# Long-lived, manually managed (the ~150 GB index is downloaded once, not rebuilt
# on every deploy). Start/refresh with:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.photon.yml --env-file .env.production up -d photon
# The gateway reaches it in-network at http://photon:2322 (PHOTON_URL default).
services:
  photon:
    # Pinned to a digest (audit) — same image currently running. Photon is
    # manually managed (huge index volume); a floating :latest risks an
    # incompatible pull on a recreate. Bump deliberately.
    image: rtuszik/photon-docker:latest@sha256:729f883612bde3215c156111b421d8e0a27b1eb411b92ef4a24bd587b8259b04
    container_name: hbcfield-photon
    restart: unless-stopped
    environment:
      REGION: "planet"           # full-planet prebuilt index
      UPDATE_STRATEGY: "DISABLED" # don't auto-refresh the huge index
      LOG_LEVEL: "INFO"
    volumes:
      - photon_data:/photon/data
    ports:
      - "127.0.0.1:2322:2322"    # localhost only; gateway uses the docker network
    networks:
      hbcfield-network:
        aliases:
          - photon               # gateway reaches it at http://photon:2322 (PHOTON_URL default)
volumes:
  photon_data:
networks:
  hbcfield-network:
    external: true               # the network created by the main compose project
