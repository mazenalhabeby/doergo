# Platform Control Center vhost — admin.hbcfield.com
# Independent admin app (container 127.0.0.1:3002), SAME backend: /api proxies to
# the api-gateway on the SAME origin so there's no CORS. Lock down further with
# Cloudflare Access (SSO/2FA) and/or an `allow`/`deny` IP list below.
#
# Install (prod host nginx):
#   1. DNS: add admin.hbcfield.com in Cloudflare → server IP (proxied).
#   2. cp this file → /etc/nginx/sites-available/admin.hbcfield.com
#      ln -s /etc/nginx/sites-available/admin.hbcfield.com /etc/nginx/sites-enabled/
#   3. TLS cert (pick one):
#        a) Cloudflare Origin Cert for *.hbcfield.com → put fullchain/privkey paths below, OR
#        b) certbot --nginx -d admin.hbcfield.com  (needs DNS resolving first)
#   4. nginx -t && systemctl reload nginx

server {
    server_name admin.hbcfield.com;
    client_max_body_size 10M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # OPTIONAL hard IP-allowlist (uncomment + set your office/VPN IPs):
    # allow 203.0.113.0/24;
    # deny all;

    # Same-origin API → the shared gateway (no CORS).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-time support — Socket.IO on the notification-service (:4001).
    # Same origin so the admin app connects with no CORS; needs WebSocket upgrade.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # The admin app.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    # Option (b) certbot fills these; for (a) point to the Cloudflare origin cert:
    ssl_certificate     /etc/letsencrypt/live/admin.hbcfield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.hbcfield.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = admin.hbcfield.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name admin.hbcfield.com;
    return 404;
}
