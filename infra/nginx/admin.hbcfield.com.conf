server {
    server_name admin.hbcfield.com;
    # Behind Cloudflare, every request arrives from a Cloudflare address.
    # Without this, $remote_addr IS that address: the gateway's 3-req/sec
    # rate limiter would put every visitor in the world into a handful of
    # buckets and throttle them against each other, and the audit log would
    # record Cloudflare as the actor for every action. Trusting
    # CF-Connecting-IP is only safe because set_real_ip_from restricts it to
    # connections that genuinely come from Cloudflare.
    include /etc/nginx/cloudflare-realip.conf;

    # ── Origin access control: Cloudflare only ──────────────────────────────
    # The operator console must not be reachable by going around Cloudflare to
    # the origin IP. The Cloudflare ranges are maintained ONCE, in the include
    # above (generated monthly by infra/refresh-cloudflare-ips.sh, see
    # infra/cron/cloudflare-realip), so this reuses that list instead of
    # keeping a second allow-list that would drift from it:
    #
    #   realip rewrites $remote_addr to CF-Connecting-IP ONLY for a connection
    #   whose peer is in a set_real_ip_from range. From anywhere else the two
    #   stay equal. So "unchanged" means "did not come through Cloudflare".
    #
    # (A Cloudflare request always carries CF-Connecting-IP, and the visitor's
    # address is never a Cloudflare edge address, so a genuine request always
    # differs.) Applies to every location here — /api/, /socket.io/ and the
    # console. ⚠️ This file only: hbcfield.com is NOT changed by this.
    if ($realip_remote_addr = $remote_addr) {
        return 403;
    }

    client_max_body_size 10M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The console needs the PLATFORM API and nothing else. Every other gateway
    # route (the customer API, billing webhooks, the static-key admin routes)
    # is 404 on this host, so the operator origin is not a second way into the
    # product. The gateway pairs this with PLATFORM_ALLOWED_HOSTS: platform
    # routes answer only on this host.
    location ^~ /api/v1/platform/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        return 404;
    }
    # Live support inbox (Socket.IO, authenticate_agent with the staff token).
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.hbcfield.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.hbcfield.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = admin.hbcfield.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.hbcfield.com;
    return 404; # managed by Certbot


}