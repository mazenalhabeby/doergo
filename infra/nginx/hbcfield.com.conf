##
# hbcfield.com
#
# Static assets are served from disk by nginx, NOT proxied through Node.
#
# Every script, font, image and the 4MB hero video used to fall through
# `location /` into the Next.js server: nginx asked Node, Node read the file off
# disk, and nginx — whose proxy buffers top out at 128k — wrote the response
# back to a temporary file before sending it. The two largest assets on the site
# spilled to disk on every cache miss, and `sendfile` was never reached.
#
# The build assets are published to /opt/doergo/static by infra/sync-static.sh,
# which must run after every web-app deploy. If it does not run, or runs late,
# `try_files ... @nextjs` sends the request to Node exactly as before — a missed
# sync costs the optimisation and never a 404.
##

server {
    server_name hbcfield.com;
    # Behind Cloudflare, every request arrives from a Cloudflare address.
    # Without this, $remote_addr IS that address: the gateway's 3-req/sec
    # rate limiter would put every visitor in the world into a handful of
    # buckets and throttle them against each other, and the audit log would
    # record Cloudflare as the actor for every action. Trusting
    # CF-Connecting-IP is only safe because set_real_ip_from restricts it to
    # connections that genuinely come from Cloudflare.
    include /etc/nginx/cloudflare-realip.conf;


    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxied application routes ───────────────────────────────────────────
    #
    # `^~` on each of these is load-bearing. A regex location beats a plain
    # prefix location, so without it the static-media regex below would capture
    # /uploads/avatar.png and serve a 404 from the wrong directory instead of
    # the avatar. The marker says "if this prefix matches, stop looking".

    # API Gateway
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # APK downloads
    location ^~ /downloads/ {
        alias /opt/doergo/infra/docker/downloads/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition 'attachment';
    }

    # User-uploaded static files (avatars) - served by the API gateway
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Build assets, straight off disk ──────────────────────────────────────
    #
    # Filenames carry a content hash, so a year of immutable caching is safe:
    # a changed file is a different URL. `immutable` also tells the browser not
    # to spend a revalidation round trip on a refresh — which over a 200ms link
    # to the US is the difference between instant and not.
    location ^~ /_next/static/ {
        root /opt/doergo/static;
        try_files $uri @nextjs;

        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── public/ media, straight off disk ─────────────────────────────────────
    #
    # These names are NOT content-hashed, so they get a day and a revalidation
    # rather than a year — replacing the hero video must not require renaming it.
    # Still an enormous improvement on the `max-age=0` Next.js serves them with,
    # which costs a round trip per asset per page load.
    #
    # Anything not present on disk falls through to Node, so this cannot shadow
    # an application route that happens to end in one of these extensions.
    location ~* \.(mp4|webm|jpe?g|png|gif|svg|ico|webp|avif|woff2?|txt)$ {
        root /opt/doergo/static/public;
        try_files $uri @nextjs;

        access_log off;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Web App
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # With the large files now served from disk, nothing left on this path
        # should exceed the proxy buffers. If anything ever does, stream it to
        # the client rather than parking it in a temp file on the way.
        proxy_max_temp_file_size 0;
    }

    # Fallback for the two static locations above.
    location @nextjs {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTP/2 is stated here rather than inherited. It was only ever on because
    # another site on this box happens to set it on the same :443 socket, so
    # editing that unrelated config would have silently dropped this one to
    # HTTP/1.1 — a large regression over a high-latency link, with nothing in
    # this file to explain it.
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hbcfield.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hbcfield.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = hbcfield.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name hbcfield.com;
    return 404; # managed by Certbot


}
# --- www.hbcfield.com -> redirect to canonical apex (added to fix ERR_CERT_COMMON_NAME_INVALID) ---
server {
    listen 443 ssl;
    server_name www.hbcfield.com;
    ssl_certificate /etc/letsencrypt/live/hbcfield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hbcfield.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://hbcfield.com$request_uri;
}
server {
    listen 80;
    server_name www.hbcfield.com;
    return 301 https://hbcfield.com$request_uri;
}
