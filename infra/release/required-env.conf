# Environment variables that must be NON-EMPTY inside each running container
# after a release. Checked by infra/release/deploy.sh by NAME only — values are
# never read into the script, printed or logged.
#
# Why this exists: compose uses explicit `environment:` lists and the production
# secrets arrive through docker-compose.override.yml. A recreate with the wrong
# compose invocation (a single `-f`) silently drops them, and the containers
# start perfectly happily without — geo search falls back, the operator console
# stops authenticating, billing breaks. Twice so far.
#
# Format: <compose service> <VAR> [<VAR> …]   (# comments and blank lines ignored)
# A missing variable fails the release and rolls it back. Remove a name here
# only when production deliberately runs without it.

api-gateway          JWT_ACCESS_SECRET REDIS_PASSWORD METRICS_TOKEN GOOGLE_PLACES_API_KEY PLATFORM_ADMIN_KEY
auth-service         JWT_ACCESS_SECRET JWT_REFRESH_SECRET REDIS_PASSWORD DIRECT_DATABASE_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET S3_ACCESS_KEY S3_SECRET_KEY
notification-service JWT_ACCESS_SECRET REDIS_PASSWORD PLATFORM_ADMIN_KEY
task-service         REDIS_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY
tracking-service     REDIS_PASSWORD
